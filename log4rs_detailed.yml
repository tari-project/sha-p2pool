refresh_rate: 30 seconds
appenders:

  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%dT%H:%M:%S%Z)} {h({l}):5} {t} {m}{n}"
    filters:
      - kind: threshold
        level: info

  other:
    kind: rolling_file
    path: "{{log_dir}}/log/other.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/other.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l:5} {m} // {f}:{L}{n}"

  sync:
    kind: rolling_file
    path: "{{log_dir}}/log/sync.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/sync.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l:5} {m} // {f}:{L}{n}"

  p2p:
    kind: rolling_file
    path: "{{log_dir}}/log/p2p.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/p2p.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l:5} {m} // {f}:{L}{n}"

  peer_info:
    kind: rolling_file
    path: "{{log_dir}}/log/peer_info.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/peer_info.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l:5} {m} // {f}:{L}{n}"

  sharechain:
    kind: rolling_file
    path: "{{log_dir}}/log/sharechain.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/sharechain.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l:5} {m} // {f}:{L}{n}"

  grpc:
    kind: rolling_file
    path: "{{log_dir}}/log/grpc.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 100mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/grpc.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l:5} {m} // {f}:{L}{n}"

root:
  level: info
  appenders:
    - stdout
    - other


loggers:
  tari::p2pool:
    level: info
    appenders:
      - stdout
    additive: false

  tari::p2pool::server:
    level: info
    appenders:
      - other
    additive: false
  tari::p2pool::main:
    level: info
    appenders:
      - other
    additive: false

  tari::p2pool::sharechain:
    level: debug
    appenders:
      - sharechain
    additive: false

  tari::p2pool::server::p2p:
     level: debug
     appenders:
       - p2p
     additive: false
  tari::p2pool::message_logging:
     level: debug
     appenders:
       - p2p
     additive: false
  tari::p2pool::peer_store:
    level: debug
    appenders:
      - p2p
    additive: false

  tari::p2pool::grpc::proxy:
    level: debug
    appenders:
      - grpc
    additive: false
  tari::p2pool::server::grpc::p2pool:
    level: debug
    appenders:
      - grpc
    additive: false

  tari::p2pool::topics:
    level: debug
    appenders:
      - peer_info
    additive: false

  sync_request:
    level: debug
    appenders:
      - sync
    additive: false
