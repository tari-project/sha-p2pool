[package]
name = "sha_p2pool"
authors = ["The Tari Development Community"]
repository = "https://github.com/tari-project/sha-p2pool"
license = "BSD-3-Clause"
version = "0.22.3"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.80"
axum = "0.7.7"
blake2 = "0.10.6"
bitflags = { version = "2.4", features = ["serde"] }
chrono = "0.4.39"
clap = { version = "4.5.7", features = ["derive"] }
digest = "0.10.7"
dirs = "4.0.0"
hex = "0.4.3"
hickory-resolver = { version = "*", features = ["dns-over-rustls"] }
human_format = "1.1.0"
humantime = "2.1.0"
itertools = "0.13.0"
lazy_static = "1.5.0"
libp2p = { version = "0.54.1", features = [
  "dns",
  "identify",
  "macros",
  "tokio",
  "serde",
  "noise",
  "tcp",
  "yamux",
  "mdns",
  "gossipsub",
  "request-response",
  "json",
  "cbor",
  "relay",
  "dcutr",
  "autonat",
  "memory-connection-limits",
  "rsa",
  "ecdsa",
  "ping",
  "quic",
] }
log = { version = "0.4.21", features = ["kv"] }
log4rs = "1.3.0"
minotari_app_grpc = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
minotari_node_grpc_client = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
num = { version = "0.4.3", features = ["default", "num-bigint", "serde"] }
rand = "0.8.0"
serde = "1.0.203"
serde_cbor = "0.11.2"
serde_json = "1.0.122"
tari_common = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
tari_common_types = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
tari_core = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
tari_crypto = "0.22.0"
tari_script = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
tari_shutdown = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
tari_mmr = { git = "https://github.com/tari-project/tari.git", rev = "b3dc63f79e7bedd19854c17e5d9809deb652e61d" }
tari_utilities = { version = "0.8", features = ["borsh"] }
thiserror = "1.0"
tokio = { version = "1.41.0", features = ["full"] }
tonic = { version = "0.12.3", features = ["tls-webpki-roots"] }
lru = "0.12.5"
tempfile = "3.14.0"
rkv = { version = "0.19.0", features = ["lmdb"] }
bincode = "1.3.3"
prometheus = "0.13.4"

[package.metadata.cargo-machete]
ignored = ["log4rs"]

[lib]
name = "sha_p2pool"
path = "src/lib.rs"

[[bin]]
name = "sha_p2pool"
path = "src/main.rs"
