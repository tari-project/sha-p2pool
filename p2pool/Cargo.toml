[package]
name = "sha_p2pool"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1.80"
axum = "0.7.7"
blake2 = "0.10.6"
bitflags = { version = "2.4", features = ["serde"] }
chrono = "0.4.39"
clap = { version = "4.5.7", features = ["derive"] }
ctrlc = "3.2"
dhat = "0.3.3"
digest = "0.10.7"
dirs = "4.0.0"
hex = "0.4.3"
hickory-resolver = { version = "*", features = ["dns-over-rustls"] }
human_format = "1.1.0"
humantime = "2.1.0"
itertools = "0.13.0"
lazy_static = "1.5.0"
libc = "0.2"
libp2p = { version = "0.54.1", features = [
  "dns",
  "identify",
  "macros",
  "tokio",
  "serde",
  "noise",
  "tcp",
  "yamux",
  "mdns",
  "gossipsub",
  "request-response",
  "json",
  "cbor",
  "relay",
  "dcutr",
  "autonat",
  "memory-connection-limits",
  "rsa",
  "ecdsa",
  "ping",
  "quic",
] }
log = { workspace = true }
log4rs = "1.3.0"
minotari_app_grpc = { git = "https://github.com/tari-project/tari.git", rev = "b5da6e87d9d32532b76f2c25221c540db4f51ef3" }
minotari_node_grpc_client = { git = "https://github.com/tari-project/tari.git", rev = "b5da6e87d9d32532b76f2c25221c540db4f51ef3" }
num = { version = "0.4.3", features = ["default", "num-bigint", "serde"] }
rand = "0.8.0"
serde = "1.0.203"
serde_cbor = "0.11.2"
serde_json = { workspace = true }
tari_common = { git = "https://github.com/tari-project/tari.git", rev = "b5da6e87d9d32532b76f2c25221c540db4f51ef3" }
tari_common_types = { git = "https://github.com/tari-project/tari.git", rev = "b5da6e87d9d32532b76f2c25221c540db4f51ef3" }
tari_core = { git = "https://github.com/tari-project/tari.git", rev = "b5da6e87d9d32532b76f2c25221c540db4f51ef3" }
tari_crypto = "0.22"
tari_script = { git = "https://github.com/tari-project/tari.git", rev = "b5da6e87d9d32532b76f2c25221c540db4f51ef3" }
tari_shutdown = { workspace = true }
tari_mmr = { git = "https://github.com/tari-project/tari.git", rev = "b5da6e87d9d32532b76f2c25221c540db4f51ef3" }
tari_stratum = { path = "../stratum" }
tari_utilities = { version = "0.8", features = ["borsh"] }
thiserror = "1.0"
tokio = { workspace = true }
tonic = { version = "0.12.3", features = ["tls-webpki-roots"] }
lru = "0.12.5"
tempfile = "3.14.0"
rkv = { version = "0.19.0", features = ["lmdb"] }
bincode = "1.3.3"

[package.metadata.cargo-machete]
ignored = ["log4rs"]

[lib]
name = "sha_p2pool"
path = "src/lib.rs"

[[bin]]
name = "sha_p2pool"
path = "src/main.rs"

[features]
# If you are doing heap profiling, use 'dhat-heap' and enable debug symbols:
#   CARGO_PROFILE_RELEASE_DEBUG=true cargo build --release --bin minotari_node --features=dhat-heap            ...(Linux)
#   $env:CARGO_PROFILE_RELEASE_DEBUG = "true"; cargo build --release --bin minotari_node --features=dhat-heap  ...(PowerShell)
dhat-heap = []
